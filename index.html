<script>

function connect(host){let code=host?String(100000+Math.floor(Math.random()*900000)):$('roomcode').value.trim();if(!/^\d{6}$/.test(code)){status('6桁の部屋番号を入力してね');return}if(typeof Peer==='undefined'){status('通信ライブラリを読み込めません。再読み込みしてね');return}disconnect();mode=host?'host':'guest';room=code;ready=false;remoteJump=jumpSeq=0;let token=++generation;lobby(host?'部屋を作成中…':'接続中…');try{peer=host?new Peer('stickbrawl-v4-'+code):new Peer();peer.on('open',()=>{if(token!==generation)return;if(host){clearTimeout(timeout);status('番号を友達に伝えて、入室を待ってね')}else{let link=peer.connect('stickbrawl-v4-'+code,{reliable:true,serialization:'json'});bindConnection(link,token)}});peer.on('connection',link=>{if(mode==='host'&&token===generation)bindConnection(link,token);else link.close()});peer.on('error',e=>{if(token===generation)disconnect(e.type==='unavailable-id'?'部屋番号が使用中です。作り直してね':e.type==='peer-unavailable'?'部屋が見つかりません。番号を確認してね':'接続できません。通信環境を確認してね')});timeout=setTimeout(()=>{if(token===generation&&!ready)disconnect('接続がタイムアウトしました。再試行してね')},18000)}catch(e){disconnect('接続を開始できませんでした')}}
$('start').onclick=start;$('create').onclick=()=>connect(true);$('join').onclick=()=>connect(false);$('leave').onclick=()=>disconnect();$('back').onclick=()=>disconnect();$('copyroom').onclick=async()=>{try{await navigator.clipboard.writeText(room);status('部屋番号をコピーしました')}catch(e){status('部屋番号を手動で友達に伝えてね')}};

function jump(f){if(f.jumps>0&&!f.hit&&!f.guard){f.vy=-types[f.type].jump;f.y-=2;f.ground=false;f.jumps--;burst(f.x,f.y,f.type===3?15:5,f.type===3?types[3].accent:'#fff')}}
function burst(x,y,n,color){for(let i=0;i<n;i++)fx.push({x,y,vx:(Math.random()-.5)*13,vy:(Math.random()-.5)*13,life:22+Math.random()*12,color})}
function attack(f,o,special){

}

function ai(){let a=difficulty(),dx=p.x-c.x,dy=p.y-c.y,m=0,guard=false;wait--;
